<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Delivery Framework</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@500;600;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: чертёж цеха. Вкладки идут по логике фреймворка: модель → конвейер → спека → обвязка → Andon → контроль → метрики → ритм → внедрение → приложения.
   Каждое понятие определено в одном месте, остальные разделы на него ссылаются. У каждого правила пометка: источник / гипотеза / наше. */
:root{
  --bg:#f2f4f9; --grid:#e3e8f2; --surface:#ffffff; --sunk:#eaeef6;
  --ink:#121b33; --muted:#566280; --line:#d3dae8;
  --accent:#1d4ed0; --accent-soft:#e3eafc; --on-accent:#ffffff;
  --ok:#17723f; --ok-soft:#dcf2e4; --warn:#955600; --warn-soft:#fcecc9; --crit:#b92d1c; --crit-soft:#fce1dc;
  --our:#6b3fb5; --our-soft:#eee6fb;
  --hatch:rgba(29,78,208,.09);
  --display:"Geologica","Onest",system-ui,sans-serif;
  --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0b1224; --grid:#121b33; --surface:#131c36; --sunk:#0f1730;
  --ink:#e7ecf9; --muted:#95a2c2; --line:#27355a;
  --accent:#86a8ff; --accent-soft:#1a2a57; --on-accent:#0b1224;
  --ok:#62d296; --ok-soft:#11331f; --warn:#f3bb55; --warn-soft:#3a2c0b; --crit:#ff8773; --crit-soft:#42170f;
  --our:#c6a6ff; --our-soft:#2b1d4a;
  --hatch:rgba(134,168,255,.10); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0b1224; --grid:#121b33; --surface:#131c36; --sunk:#0f1730;
  --ink:#e7ecf9; --muted:#95a2c2; --line:#27355a;
  --accent:#86a8ff; --accent-soft:#1a2a57; --on-accent:#0b1224;
  --ok:#62d296; --ok-soft:#11331f; --warn:#f3bb55; --warn-soft:#3a2c0b; --crit:#ff8773; --crit-soft:#42170f;
  --our:#c6a6ff; --our-soft:#2b1d4a;
  --hatch:rgba(134,168,255,.10); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.55 var(--body);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:32px 32px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.2}
h2{font-size:26px;font-weight:600}
h3{font-size:17px;font-weight:600}
p{margin:0}
.mono{font-family:var(--mono);font-size:.9em}
.muted{color:var(--muted)}
.eyebrow{font:600 11px/1.2 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;gap:18px;align-items:center;min-width:0}
.brand{font:700 15px/1 var(--display);white-space:nowrap;padding-block:16px}
.brand small{display:block;font:400 11px/1 var(--mono);color:var(--muted);margin-top:5px}
nav{display:flex;gap:0;overflow-x:auto;min-width:0;flex:1;scrollbar-width:none}
nav a{padding:18px 9px;white-space:nowrap;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent}
nav a:hover{color:var(--ink)}
nav a[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}

main{max-width:1180px;margin:0 auto;padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:36px}
.lead{max-width:72ch;color:var(--muted);font-size:16px;margin-top:8px}
section.blk{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:20px;min-width:0}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.cols3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
dl.kv{margin:0;display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px 16px}
dl.kv dt{color:var(--muted);font-size:13px}
dl.kv dd{margin:0}
.formula{font-family:var(--mono);font-size:13px;background:var(--sunk);border-left:3px solid var(--accent);padding:10px 12px;border-radius:0 4px 4px 0;white-space:pre-line}
blockquote{margin:0;padding:12px 14px;background:var(--accent-soft);border-radius:4px;font-size:14px}
.note{padding:12px 14px;border:1px dashed var(--line);border-radius:4px;font-size:14px;color:var(--muted)}
.lk{font-weight:500;text-decoration:none;border-bottom:1px dashed var(--accent)}
.lk::after{content:" →"}
.src{font-size:13px;color:var(--muted)}
.src a{color:var(--muted)}
.links{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px}

.pill{display:inline-block;font:600 11px/1 var(--mono);letter-spacing:.04em;padding:5px 8px;border-radius:99px;white-space:nowrap;vertical-align:2px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)}
.pill.info{background:var(--accent-soft);color:var(--accent)} .pill.our{background:var(--our-soft);color:var(--our)}
.evlegend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:13px;color:var(--muted);align-items:center}

/* tiles */
.strip{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.strip.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.tile{background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit;min-width:0}
a.tile:hover{background:var(--sunk)}
.tile b{font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.tile .norm{font-size:13px;color:var(--muted)}
.tile .pill{align-self:flex-start}

/* flow strip on the model tab */
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:stretch}
.flow a{flex:1 1 130px;text-decoration:none;color:inherit;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;font:600 13px/1.25 var(--display);min-width:0}
.flow a small{display:block;font:400 11px/1.2 var(--mono);color:var(--muted);margin-bottom:5px}
.flow a.machine{border-style:dashed;background-image:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px)}
.flow a.alarm{border-color:var(--crit);flex-basis:100%}
.flow a:hover{border-color:var(--accent)}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}
.st{appearance:none;font:inherit;color:inherit;text-align:left;cursor:pointer;background:var(--surface);border:1.5px solid var(--line);border-radius:6px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0;position:relative}
.st .no{font:600 12px/1 var(--mono);color:var(--muted)}
.st .nm{font:600 14px/1.25 var(--display)}
.st .who{font:400 11px/1.25 var(--mono);color:var(--muted)}
.st.machine{background-image:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 12px);border-style:dashed}
.st.alarm{border-color:var(--crit);grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:baseline;gap:6px 14px} .st.alarm .no{color:var(--crit)}
.st:hover{border-color:var(--accent)}
.st[aria-pressed="true"]{border-color:var(--accent);border-style:solid;box-shadow:0 0 0 2px var(--accent)}
.st.live::after{content:"";position:absolute;top:10px;right:10px;width:10px;height:10px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 4px var(--warn-soft)}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:22px;height:12px;border:1.5px solid var(--line);border-radius:3px;vertical-align:-1px;margin-right:6px;background:var(--surface)}
.legend i.m{border-style:dashed;background-image:repeating-linear-gradient(135deg,var(--hatch) 0 4px,transparent 4px 8px)}
.legend i.a{border-color:var(--crit)} .legend i.l{border:0;border-radius:50%;width:10px;height:10px;background:var(--warn)}

/* segmented */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button,.btn{appearance:none;font:500 14px/1.2 var(--body);color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:10px 14px;cursor:pointer;text-align:left}
.seg button small{display:block;font:400 11px/1.2 var(--mono);color:var(--muted);margin-top:3px}
.seg button:hover,.btn:hover{border-color:var(--accent)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg button[aria-pressed="true"] small{color:var(--on-accent);opacity:.8}
.btn:disabled{opacity:.45;cursor:default;border-color:var(--line)}

/* scenario */
.meter{position:relative;height:10px;background:var(--sunk);border-radius:99px;margin:22px 0 6px}
.meter span{display:block;height:100%;border-radius:99px;background:var(--ok);transition:width .25s}
.meter span.warn{background:var(--warn)} .meter span.crit{background:var(--crit)}
.meter em{position:absolute;top:-18px;transform:translateX(-50%);font:400 10px/1 var(--mono);color:var(--muted);font-style:normal;white-space:nowrap}
.meter em::after{content:"";position:absolute;left:50%;top:14px;width:1px;height:18px;background:var(--muted)}
.log{font-family:var(--mono);font-size:13px;background:var(--sunk);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:4px;overflow-x:auto}
.player-nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.player-nav .cnt{font:400 12px/1 var(--mono);color:var(--muted)}

/* tables */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:680px;font-size:14px}
th,td{text-align:left;vertical-align:top;padding:10px 12px;border-bottom:1px solid var(--line)}
th{font:600 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:600}

.matrix{display:grid;grid-template-columns:120px repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.matrix>div{background:var(--surface);padding:12px;font-size:14px;min-width:0}
.matrix .h{background:var(--sunk);font:600 11px/1.3 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}

/* phases */
.phases{display:flex;flex-direction:column;gap:10px}
.ph{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.ph .pn{font:700 26px/1 var(--display);color:var(--accent)}
.gate{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gate>div{background:var(--sunk);border-radius:4px;padding:10px 12px;font-size:14px}
.gate b,.segnote b{display:block;font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.segnote{background:var(--accent-soft);border-radius:4px;padding:10px 12px;font-size:14px}
.segnote b{color:var(--accent)}

.evgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.evc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.evc .big{font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums}

/* forms */
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.fields label{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--muted)}
input[type=number]{font:600 15px/1 var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:9px 10px;width:100%}
.verdict{border-radius:4px;padding:12px 14px;font-size:14px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)} .verdict.warn{background:var(--warn-soft);color:var(--warn)} .verdict.crit{background:var(--crit-soft);color:var(--crit)} .verdict.info{background:var(--accent-soft);color:var(--accent)}
.verdict b{display:block;margin-bottom:4px}
.verdict ul{margin:4px 0 0;padding-left:18px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{margin-top:4px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.num{font:600 12px/1 var(--mono);color:var(--accent);background:var(--accent-soft);border-radius:3px;padding:4px 6px;margin-right:8px}
pre.code{margin:0;font:400 13px/1.55 var(--mono);background:var(--sunk);border:1px solid var(--line);border-radius:6px;padding:14px 16px;overflow-x:auto;white-space:pre}
.flash{animation:flash 1.4s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}
@media (prefers-reduced-motion:reduce){.flash{animation:none}.meter span{transition:none}}

@media (max-width:980px){ .strip{grid-template-columns:repeat(3,minmax(0,1fr))} .pipe{grid-template-columns:repeat(3,minmax(0,1fr))} .cols3,.evgrid{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width:640px){ .cols,.cols3,.evgrid,.gate,.strip.three{grid-template-columns:minmax(0,1fr)} .strip,.pipe{grid-template-columns:repeat(2,minmax(0,1fr))} dl.kv{grid-template-columns:minmax(0,1fr);gap:2px 0} dl.kv dd{margin-bottom:10px} h2{font-size:22px} .brand small{display:none} .top-in{gap:10px} .ph{grid-template-columns:minmax(0,1fr);gap:8px} .matrix{grid-template-columns:84px repeat(2,minmax(0,1fr))} }
</style>

<header class="top"><div class="top-in">
  <div class="brand">Agentic Delivery<small>Framework</small></div>
  <nav id="nav" aria-label="Разделы">
    <a href="#model">Модель</a><a href="#conveyor">Конвейер</a><a href="#spec">Спека</a><a href="#harness">Обвязка</a><a href="#andon">Andon</a><a href="#control">Контроль</a><a href="#metrics">Метрики</a><a href="#rhythm">Ритм</a><a href="#adoption">Внедрение</a><a href="#startup">Стартап-кит</a><a href="#evidence">Основания</a>
  </nav>
</div></header>

<main>
<div class="view" id="v-model"></div>
<div class="view" id="v-conveyor" hidden></div>
<div class="view" id="v-spec" hidden></div>
<div class="view" id="v-harness" hidden></div>
<div class="view" id="v-andon" hidden></div>
<div class="view" id="v-control" hidden></div>
<div class="view" id="v-metrics" hidden></div>
<div class="view" id="v-rhythm" hidden></div>
<div class="view" id="v-adoption" hidden></div>
<div class="view" id="v-startup" hidden></div>
<div class="view" id="v-evidence" hidden></div>
</main>

<script>
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const L=(t,x)=>`<a class="lk" href="#${t.split(':')[0]}" data-t="${t}">${x}</a>`;
const X=(u,x)=>`<a href="${u}" target="_blank" rel="noopener">${x}</a>`;
const pill=(s,x)=>`<span class="pill ${s}">${x}</span>`;
const EV={src:['ok','ЕСТЬ ИСТОЧНИК'],hyp:['warn','ГИПОТЕЗА'],our:['our','НАШЕ ПРЕДЛОЖЕНИЕ']};
const ev=k=>pill(EV[k][0],EV[k][1]);
const ul=a=>`<ul class="plain">${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;
const tbl=(head,rows)=>`<div class="scroll"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const pick={};
const num=id=>parseFloat($('#'+id).value)||0;
const EVLEG=`<div class="evlegend"><span>${ev('src')} подтверждено внешними данными</span><span>${ev('hyp')} стартовое значение, калибруется на своих данных</span><span>${ev('our')} наш вывод, в источниках напрямую нет</span></div>`;
const RC=c=>pill(c==='R2'?'crit':c==='R1'?'warn':'ok',c);

/* ================= ПОСТЫ (единый источник для Модели и Конвейера) ================= */
const ST=[
 {k:'spec',n:'Спека готова',en:'Spec Ready',who:'человек',cls:'',owner:'Автор спеки',
  inp:'Идея или требование от бизнеса.',
  what:'Автор спеки и владелец capability собирают пакет спецификации: намерение, критерии приёмки, контракт, тесты-критерии, класс риска и границы задачи.',
  out:'Definition of Ready: каждый критерий привязан к исполняемому тесту, который пока падает. Класс риска присвоен. Для R2 спеку утвердил второй человек.',
  fail:'Задача остаётся у людей. Агент её не получает.',
  ev:'src',evn:'Структура пакета взята из GitHub Spec Kit и AWS Kiro. Требование, чтобы тесты-критерии утверждал человек, наше: Бёкелер предупреждает, что тесты, написанные тем же агентом, могут проверять не то.',
  links:[L('spec','Как собрать спеку'),L('model:risk','Классы риска')]},
 {k:'run',n:'Запуск агента',en:'Sandboxed Run',who:'агент',cls:'machine',owner:'Владелец capability',
  inp:'Пакет спецификации, прошедший Definition of Ready.',
  what:'Агент работает в изолированной песочнице под своей учётной записью: читает код, пишет изменение, сам запускает тесты и открывает PR в своей ветке.',
  out:'PR открыт, тесты-критерии зелёные в песочнице.',
  fail:'Срабатывает триггер Andon: цикл, выход за границы задачи, правка тестов-критериев, превышение порога шагов, времени или бюджета.',
  ev:'src',evn:'Так устроены фоновые агенты Stripe и Ramp и облачные режимы основных кодинг-агентов: удалённая песочница, которая возвращает PR.',
  links:[L('harness','Обвязка'),L('andon:triggers','Триггеры Andon'),L('control:security','Контроли безопасности')]},
 {k:'gates',n:'Гейты',en:'Automated Gates',who:'автоматика',cls:'machine',owner:'Владелец обвязки',
  inp:'PR агента.',
  what:'Детерминированные проверки: типы, линтеры, сборка, юнит- и интеграционные тесты, структурные тесты, анализ уязвимостей, зависимости, конфигурация доступа к данным.',
  out:'Все проверки зелёные. Результат бинарный, людей здесь нет.',
  fail:'Агент получает текст ошибки и исправляет. На один запуск даётся 2 раунда CI, включая исправления после ИИ-ревью. Не уложился — Andon.',
  ev:'src',evn:'Лимит в 2 раунда CI — правило Stripe Minions: после второго неудачного раунда ветка уходит инженеру. Мы читали его во вторичных источниках, формулировка в них совпадает.',
  links:[L('harness:matrix','Guides и sensors'),L('metrics:firstpass','First-Time Pass Rate')]},
 {k:'aireview',n:'ИИ-ревью',en:'AI Review',who:'автоматика',cls:'machine',owner:'Владелец обвязки',

## Стек
Next.js 15 (App Router), TypeScript strict, Supabase (Postgres + Auth), Tailwind.

pnpm dev          # локальный запуск

const VIEWS=['model','conveyor','spec','harness','andon','control','metrics','rhythm','adoption','startup','evidence'];
const ALIAS={slicing:'spec',basis:'harness',scale:'adoption',transition:'adoption'};
const curView=()=>{let v=location.hash.slice(1); v=ALIAS[v]||v; return VIEWS.includes(v)?v:'model'};
let pending;
function route(){
 const v=curView();
 VIEWS.forEach(x=>$('#v-'+x).hidden=x!==v);
 $$('#nav a').forEach(a=>{if(a.getAttribute('href')==='#'+v){a.setAttribute('aria-current','page');a.scrollIntoView({block:'nearest',inline:'nearest'})}else a.removeAttribute('aria-current')});
 const k=pending; pending=undefined;
 if(k===undefined) return;
 if(!k){window.scrollTo(0,0);return}
 let el=(pick[v]&&pick[v](k))?$('#'+v+'-panel'):document.getElementById(k);
 if(!el){window.scrollTo(0,0);return}
 const y=el.getBoundingClientRect().top+window.scrollY-$('header.top').offsetHeight-70;
 window.scrollTo({top:Math.max(0,y),behavior:'auto'});
 el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
}
document.addEventListener('click',e=>{
 const a=e.target.closest('a[href^="#"]'); if(!a) return;
 e.preventDefault();
 const t=a.dataset.t||a.getAttribute('href').slice(1), [v,k]=t.split(':');
 pending=k||'';
 if(curView()===v) route(); else location.hash=v;
});
window.addEventListener('hashchange',route);
renderModel();renderConveyor();renderSpec();renderHarness();renderAndon();renderControl();renderMetrics();renderRhythm();renderAdoption();renderStartup();renderEvidence();
route();
</script>
